services:
  agent:
    build: ./agent
    container_name: agent_aagent
    volumes:
      - ./agent:/app
    working_dir: /app
    command: ["sleep", "infinity"]
    restart: unless-stopped
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env
    networks:
      - rainbow_net

  qqbot:
    build: ./qqbot
    container_name: qqbot_aagent
    volumes:
      - ./qqbot:/app
    working_dir: /app
    command: ["sleep", "infinity"]
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    networks:
      - rainbow_net

  webui:
    build: ./webui
    container_name: webui_aagent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-agent_tasks}
      AGENT_WORKER_STATUS_KEY: ${AGENT_WORKER_STATUS_KEY:-aagent:worker:status}
      WEBUI_USER_ID: ${QQ_TARGET_USER_ID}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      MONGO_HISTORY_COLLECTION: ${MONGO_HISTORY_COLLECTION:-event_history}
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rainbow_net

  redis:
    image: redis:7-alpine
    container_name: redis_aagent
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rainbow_net

  mongodb:
    image: mongo:8
    container_name: mongo_aagent
    ports:
      - "27015:27017"
    volumes:
      - ./data/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    networks:
      - rainbow_net

networks:
  rainbow_net:
    driver: bridge