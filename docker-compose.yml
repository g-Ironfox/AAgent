services:
  agent:
    build: ./agent
    container_name: agent_aagent
    command: ["python", "main.py"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      webui_py:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_KERNEL_DB: ${REDIS_KERNEL_DB:-1}
      ProcessTable: ${ProcessTable:-processtable}
      PUBLIC_SCHEDULER_PREFIX: ${PUBLIC_SCHEDULER_PREFIX:-aagent:scheduler}
      AGENT_TOOLS_KEY: ${AGENT_TOOLS_KEY:-aagent:tools}
      TOOL_SERVER_URL: ${TOOL_SERVER_URL:-http://tool_server:8083}
      WORKSPACE_API_URL: ${WORKSPACE_API_URL:-http://webui_py:8081}
      MONGO_TERMINAL_COLLECTION: ${MONGO_TERMINAL_COLLECTION:-terminal_messages}
      MONGO_PROCESS_LOG_COLLECTION: ${MONGO_PROCESS_LOG_COLLECTION:-process_logs}
      TOOL_CLIENT_DEFAULT_WAIT_MS: ${TOOL_CLIENT_DEFAULT_WAIT_MS:-10000}
      TOOL_CLIENT_MAX_WAIT_MS: ${TOOL_CLIENT_MAX_WAIT_MS:-10000}
      MONGO_SESSION_COLLECTION: ${MONGO_SESSION_COLLECTION:-sessions}
      MONGO_WORKSPACE_FILE_COLLECTION: ${MONGO_WORKSPACE_FILE_COLLECTION:-workspace_files}
    networks:
      - aagent_net

  webui_py:
    build:
      context: .
      dockerfile: webui_py/Dockerfile
    container_name: webui_py_aagent
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8081"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_KERNEL_DB: ${REDIS_KERNEL_DB:-1}
      ProcessTable: ${ProcessTable:-processtable}
      PUBLIC_SCHEDULER_PREFIX: ${PUBLIC_SCHEDULER_PREFIX:-aagent:scheduler}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      MONGO_TERMINAL_COLLECTION: ${MONGO_TERMINAL_COLLECTION:-terminal_messages}
      MONGO_PROCESS_LOG_COLLECTION: ${MONGO_PROCESS_LOG_COLLECTION:-process_logs}
      MONGO_FILE_EVENT_COLLECTION: ${MONGO_FILE_EVENT_COLLECTION:-workspace_file_events}
      MONGO_WORKSPACE_FILE_COLLECTION: ${MONGO_WORKSPACE_FILE_COLLECTION:-workspace_files}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aagent_net

  manager_webui:
    build: ./manager_webui
    container_name: manager_webui_aagent
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8084"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      MONGO_DOCUMENT_COLLECTION: ${MONGO_DOCUMENT_COLLECTION:-documents}
      MONGO_MODEL_COLLECTION: ${MONGO_MODEL_COLLECTION:-models}
      MONGO_SESSION_COLLECTION: ${MONGO_SESSION_COLLECTION:-sessions}
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aagent_net

  workflow_editor:
    build: ./workflow_editor
    container_name: workflow_editor_aagent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AGENT_TOOLS_KEY: ${AGENT_TOOLS_KEY:-aagent:tools}
      TOOL_SERVER_URL: ${TOOL_SERVER_URL:-http://tool_server:8083}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      MONGO_MODEL_COLLECTION: ${MONGO_MODEL_COLLECTION:-models}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aagent_net

  tool_server:
    build: ./tool_server
    container_name: tool_server_aagent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      MONGO_TOOL_TASK_LOG_COLLECTION: ${MONGO_TOOL_TASK_LOG_COLLECTION:-tool_task_logs}
      TOOL_CALLBACK_EVENT_TYPES: ${TOOL_CALLBACK_EVENT_TYPES:-async_result}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aagent_net

  tool_provider:
    build: ./tool_provider
    container_name: tool_provider_aagent
    restart: unless-stopped
    depends_on:
      tool_server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TOOL_SERVER_WS_URL: ws://tool_server:8083/ws/providers
      TOOL_PROVIDER_ID: ${TOOL_PROVIDER_ID:-provider-default-01}
      TOOL_PROVIDER_REVISION: ${TOOL_PROVIDER_REVISION:-5}
      TOOL_PROVIDER_CONSUMERS: ${TOOL_PROVIDER_CONSUMERS:-1}
      TOOL_PROVIDER_QUEUE_SIZE: ${TOOL_PROVIDER_QUEUE_SIZE:-128}
      TOOL_PROVIDER_HEARTBEAT_SECONDS: ${TOOL_PROVIDER_HEARTBEAT_SECONDS:-20}
      TOOL_MODULES: ${TOOL_MODULES:-tools.system,tools.qq,tools.bilibili,tools.documents}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      MONGO_DOCUMENT_COLLECTION: ${MONGO_DOCUMENT_COLLECTION:-documents}
    networks:
      - aagent_net

  benchmark_worker:
    build:
      context: .
      dockerfile: benchmark_worker/Dockerfile
    image: aagent-benchmark-worker:local
    profiles: ["benchmark"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      webui_py:
        condition: service_healthy
      agent:
        condition: service_started
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      AAGENT_API_URL: http://webui_py:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BENCHMARK_QUEUE: ${BENCHMARK_QUEUE:-aagent:benchmark:jobs}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      BENCHMARK_WORKER_CONCURRENCY: ${BENCHMARK_WORKER_CONCURRENCY:-4}
      ALFWORLD_DATA: /data/alfworld
    volumes:
      - alfworld_data:/data/alfworld
    networks:
      - aagent_net

  benchmark_webui:
    build:
      context: .
      dockerfile: benchmark_webui/Dockerfile
    image: aagent-benchmark-webui:local
    profiles: ["benchmark"]
    restart: unless-stopped
    depends_on:
      webui_py:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      AAGENT_API_URL: http://webui_py:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BENCHMARK_QUEUE: ${BENCHMARK_QUEUE:-aagent:benchmark:jobs}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
    ports:
      - "${BENCHMARK_WEBUI_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aagent_net

  redis:
    image: redis:7-alpine
    container_name: redis_aagent
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - aagent_net

  mongodb:
    image: mongo:8
    container_name: mongo_aagent
    volumes:
      - ./data/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - aagent_net

networks:
  aagent_net:
    driver: bridge

volumes:
  alfworld_data:
