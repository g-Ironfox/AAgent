services:
  agent:
    build: ./agent
    container_name: agent_aagent
    command: ["python", "task_worker.py"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AGENT_TOOLS_KEY: ${AGENT_TOOLS_KEY:-aagent:tools}
    networks:
      - aagent_net

  qqbot:
    build: ./qqbot
    container_name: qqbot_aagent
    command: ["python", "listener.py"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QQ_AGENT_QUEUE_NAME: ${QQ_AGENT_QUEUE_NAME:-subagent:qq:tasks}
    networks:
      - aagent_net

  qqbot_consumer:
    build: ./qqbot_consumer
    container_name: qqbot_consumer_aagent
    command: ["python", "queue_consumer.py"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QQ_AGENT_QUEUE_NAME: ${QQ_AGENT_QUEUE_NAME:-subagent:qq:tasks}
      MAIN_AGENT_QUEUE_NAME: ${MAIN_AGENT_QUEUE_NAME:-main_agent_queue}
      QQ_AGENT_WORKER_STATUS_KEY: ${QQ_AGENT_WORKER_STATUS_KEY:-subagent:qq:worker:status}
      QQ_AGENT_SETTINGS_KEY: ${QQ_AGENT_SETTINGS_KEY:-subagent:qq:settings}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      QQ_AGENT_HISTORY_COLLECTION: ${QQ_AGENT_HISTORY_COLLECTION:-subagent_qq_history}
      MONGO_DOCUMENT_COLLECTION: ${MONGO_DOCUMENT_COLLECTION:-documents}
    networks:
      - aagent_net

  webui_py:
    build: ./webui_py
    container_name: webui_py_aagent
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8081"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIN_AGENT_QUEUE_NAME: ${MAIN_AGENT_QUEUE_NAME:-main_agent_queue}
      AGENT_WORKER_STATUS_KEY: ${AGENT_WORKER_STATUS_KEY:-aagent:worker:status}
      AGENT_SETTINGS_KEY: ${AGENT_SETTINGS_KEY:-aagent:settings}
      AGENT_TOOLS_KEY: ${AGENT_TOOLS_KEY:-aagent:tools}
      QQ_AGENT_QUEUE_NAME: ${QQ_AGENT_QUEUE_NAME:-subagent:qq:tasks}
      QQ_AGENT_HISTORY_COLLECTION: ${QQ_AGENT_HISTORY_COLLECTION:-subagent_qq_history}
      QQ_AGENT_WORKER_STATUS_KEY: ${QQ_AGENT_WORKER_STATUS_KEY:-subagent:qq:worker:status}
      QQ_AGENT_SETTINGS_KEY: ${QQ_AGENT_SETTINGS_KEY:-subagent:qq:settings}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      MONGO_HISTORY_COLLECTION: ${MONGO_HISTORY_COLLECTION:-event_history}
      MONGO_DOCUMENT_COLLECTION: ${MONGO_DOCUMENT_COLLECTION:-documents}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aagent_net

  workflow_editor:
    build: ./workflow_editor
    container_name: workflow_editor_aagent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AGENT_TOOLS_KEY: ${AGENT_TOOLS_KEY:-aagent:tools}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      MONGO_MODEL_COLLECTION: ${MONGO_MODEL_COLLECTION:-models}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aagent_net

  tool_server:
    build: ./tool_server
    container_name: tool_server_aagent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      TOOL_CALLBACK_QUEUES: ${TOOL_CALLBACK_QUEUES:-main_agent_queue}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aagent_net

  tool_provider:
    build: ./tool_provider
    container_name: tool_provider_aagent
    restart: unless-stopped
    depends_on:
      tool_server:
        condition: service_healthy
    environment:
      TOOL_SERVER_WS_URL: ws://tool_server:8083/ws/providers
      TOOL_PROVIDER_ID: ${TOOL_PROVIDER_ID:-provider-default-01}
      TOOL_PROVIDER_REVISION: ${TOOL_PROVIDER_REVISION:-1}
      TOOL_PROVIDER_CONSUMERS: ${TOOL_PROVIDER_CONSUMERS:-1}
      TOOL_PROVIDER_QUEUE_SIZE: ${TOOL_PROVIDER_QUEUE_SIZE:-128}
      TOOL_PROVIDER_HEARTBEAT_SECONDS: ${TOOL_PROVIDER_HEARTBEAT_SECONDS:-20}
      TOOL_MODULES: ${TOOL_MODULES:-tools.echo}
    networks:
      - aagent_net

  redis:
    image: redis:7-alpine
    container_name: redis_aagent
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - aagent_net

  mongodb:
    image: mongo:8
    container_name: mongo_aagent
    volumes:
      - ./data/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - aagent_net

networks:
  aagent_net:
    driver: bridge