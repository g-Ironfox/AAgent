services:
  agent:
    build: ./agent
    container_name: agent_aagent
    command: ["python", "task_worker.py"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - rainbow_net

  qqbot:
    build: ./qqbot
    container_name: qqbot_aagent
    command: ["python", "listener.py"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - rainbow_net

  webui_py:
    build: ./webui_py
    container_name: webui_py_aagent
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8081"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-agent_tasks}
      AGENT_WORKER_STATUS_KEY: ${AGENT_WORKER_STATUS_KEY:-aagent:worker:status}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DATABASE: ${MONGO_DATABASE:-agent}
      MONGO_HISTORY_COLLECTION: ${MONGO_HISTORY_COLLECTION:-event_history}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rainbow_net

  redis:
    image: redis:7-alpine
    container_name: redis_aagent
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - rainbow_net

  mongodb:
    image: mongo:8
    container_name: mongo_aagent
    volumes:
      - ./data/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rainbow_net

networks:
  rainbow_net:
    driver: bridge