<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AAgent 终端</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/terminal.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/terminal.html" aria-label="AAgent 进程终端">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name"><strong>AAgent</strong><small>TERMINAL CONSOLE</small></span>
    </a>
    <div class="top-actions">
      <nav class="page-nav" aria-label="页面导航">
        <a class="active" href="/terminal.html" aria-current="page">终端</a>
        <a href="/workspace">工作区</a>
        <a href="/workspace/replay">检查点</a>
        <a href="/logs">日志</a><a href="/scheduler">调度</a>
      </nav>
      <div class="sync-meta topbar-sync">
        <span>最后同步</span>
        <strong id="terminalLastRefresh">同步中</strong>
        <small id="terminalRefreshState">自动刷新已开启</small>
      </div>
      <label class="interval" title="自动刷新间隔"><span>刷新</span><select id="terminalInterval"><option value="500">0.5s</option><option value="1000">1s</option><option value="2000" selected>2s</option><option value="3000">3s</option><option value="5000">5s</option><option value="10000">10s</option></select></label>
      <button id="terminalPauseButton" class="icon-button" type="button" title="暂停自动刷新" aria-label="暂停自动刷新"><span class="pause-icon" aria-hidden="true"></span></button>
      <button id="terminalRefreshButton" class="icon-button" type="button" title="立即刷新" aria-label="立即刷新"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
    </div>
  </header>

  <main class="terminal-main">
    <section class="terminal-workspace" aria-labelledby="terminalTitle">
      <header class="terminal-heading">
        <div>
          <p>TERMINAL · MONGODB</p>
          <h1 id="terminalTitle">进程终端</h1>
        </div>
        <div class="terminal-heading-actions">
          <label class="terminal-picker" for="terminalSelect">
            <span>会话</span>
            <select id="terminalSelect" aria-label="选择终端">
              <option value="">暂无进程终端</option>
            </select>
          </label>
          <button id="createProcessButton" class="running-button create-process-button" type="button">创建进程</button>
          <button id="terminalLatestButton" class="running-button terminal-latest-button" type="button" title="跳到最新消息" aria-label="跳到最新消息">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="m6 13 6 6 6-6"></path></svg>
            <span>跳到最新</span>
          </button>
        </div>
      </header>

      <dialog id="createProcessDialog" class="process-dialog" aria-labelledby="createProcessTitle">
        <form id="createProcessForm" class="process-form">
          <header class="process-dialog-heading">
            <h2 id="createProcessTitle">创建进程</h2>
            <button id="closeProcessDialog" class="icon-button" type="button" aria-label="关闭">×</button>
          </header>
          <label for="processWorkflowSelect">工作流</label>
          <select id="processWorkflowSelect" required><option value="">加载中…</option></select>
          <label for="processInputs">输入参数（JSON 对象，按工作流输入类型预填，可修改）</label>
          <textarea id="processInputs" rows="5" placeholder="{}">{}</textarea>
          <p id="processCreateStatus" class="send-status" role="status"></p>
          <div class="process-dialog-actions">
            <button id="cancelProcessDialog" class="running-button" type="button">取消</button>
            <button id="submitProcessButton" class="send-button" type="submit">创建</button>
          </div>
        </form>
      </dialog>
      <div id="messageList" class="message-list" aria-live="polite">
        <div id="terminalEmpty" class="terminal-empty">
          <span class="empty-mark" aria-hidden="true">A</span>
          <strong>终端</strong>
          <small>发送消息开始对话，Agent 的终端输出将在这里追加</small>
        </div>
      </div>

      <form id="terminalForm" class="terminal-composer">
        <label for="messageInput" class="sr-only">消息</label>
        <textarea id="messageInput" name="content" rows="1" placeholder="输入消息…" autocomplete="off" required></textarea>
        <div class="composer-actions">
          <span id="sendStatus" class="send-status" role="status"></span>
          <span id="characterCount" class="character-count">0 字符</span>
          <button id="sendButton" class="send-button" type="submit">发送</button>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="/terminal.js"></script>
</body>
</html>
