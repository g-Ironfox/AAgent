# docker-compose.dev.yml — 开发调试覆盖配置(仅本地开发使用)
#
# 用法:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 与正式配置(docker-compose.yml)的区别:
#   - agent / qqbot 挂载宿主机源码,修改后无需重新构建镜像
#   - agent / qqbot 以 sleep infinity 启动,可 docker compose exec 手动运行入口
#   - redis / mongodb 暴露宿主机端口,方便用本机工具排查数据
#
# 发布时不要叠加本文件,直接使用 docker-compose.yml 即可。

services:
  agent:
    volumes:
      - ./agent:/app
    command: ["sleep", "infinity"]
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started

  qqbot:
    volumes:
      - ./qqbot:/app
    command: ["sleep", "infinity"]
    depends_on:
      redis:
        condition: service_started

  webui_py:
    volumes:
      - ./webui_py:/app
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started

  redis:
    ports:
      - "6379:6379"

  mongodb:
    ports:
      - "27015:27017"
