<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AAgent 事件流</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/event-stream.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="AAgent 事件流">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name"><strong>AAgent</strong><small>EVENT STREAM</small></span>
    </a>
    <div class="top-actions">
      <nav class="page-nav" aria-label="页面导航">
        <a class="active" href="/">事件流</a>
        <a href="/terminal.html">终端</a>
        <a href="/document.html">文档</a>
        <a href="/setting.html">设置</a>
      </nav>
      <div class="sync-meta topbar-sync">
        <span>最后同步</span>
        <strong id="lastRefresh">同步中</strong>
        <small id="refreshState">自动刷新已开启</small>
      </div>
      <label class="interval" title="自动刷新间隔"><span>刷新</span><select id="interval"><option value="500">0.5s</option><option value="1000">1s</option><option value="2000" selected>2s</option><option value="3000">3s</option><option value="5000">5s</option><option value="10000">10s</option></select></label>
      <button id="pauseButton" class="icon-button" type="button" title="暂停自动刷新" aria-label="暂停自动刷新"><span class="pause-icon" aria-hidden="true"></span></button>
      <button id="refreshButton" class="icon-button" type="button" title="立即刷新" aria-label="立即刷新"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
    </div>
  </header>

  <main>
    <section class="status-strip" aria-label="运行概览">
      <div><span>已加载历史</span><strong id="doneCount">--</strong><small>MongoDB 当前窗口</small></div>
      <div><span>等待执行</span><strong id="pendingCount">--</strong><small>Redis 队列总数</small></div>
      <div id="workerCard" class="worker-summary unknown"><span>WORKER</span><strong id="workerState">检测中</strong><small id="workerDetail">等待状态快照</small></div>
    </section>

    <section class="stream-panel">
      <div class="toolbar">
        <div class="toolbar-title"><strong>事件时间轴</strong><span id="resultCount">0 条事件</span></div>
        <div class="toolbar-fields">
          <button id="runningButton" class="running-button" type="button" title="回到正在执行" aria-label="回到正在执行">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
            <span>回到正在执行</span>
          </button>
          <div class="type-filter" id="typeFilter">
            <span class="sr-only">事件类型</span>
            <button type="button" class="type-filter-toggle" aria-haspopup="true" aria-expanded="false"><span class="type-filter-label">全部类型</span><span class="type-filter-caret" aria-hidden="true"></span></button>
            <div class="type-filter-menu" hidden></div>
          </div>
          <label class="search"><span class="search-icon" aria-hidden="true"></span><input id="searchInput" type="search" placeholder="搜索事件内容" autocomplete="off"></label>
        </div>
      </div>

      <div id="warningBanner" class="warning-banner" role="alert" hidden></div>

      <div class="timeline">
        <section id="historySection" class="event-section history-section" aria-labelledby="historyTitle">
          <header class="section-heading">
            <div class="section-marker"><span></span></div>
            <div><p>PAST · MONGODB</p><h2 id="historyTitle">执行历史</h2></div>
            <span id="historyVisibleCount" class="section-count">0</span>
          </header>
          <div class="list-head" aria-hidden="true"><span>阶段</span><span>事件</span><span>时间 / 来源</span><span></span></div>
          <div id="historyList" class="event-list"></div>
        </section>

        <section id="runningSection" class="event-section running-section" aria-labelledby="runningTitle">
          <header class="section-heading">
            <div class="section-marker"><span></span></div>
            <div><p>NOW · WORKER</p><h2 id="runningTitle">正在执行</h2></div>
            <span id="runningVisibleCount" class="section-count">0</span>
          </header>
          <div id="runningList" class="event-list"></div>
        </section>

        <section id="pendingSection" class="event-section pending-section" aria-labelledby="pendingTitle">
          <header class="section-heading">
            <div class="section-marker"><span></span></div>
            <div><p>NEXT · REDIS</p><h2 id="pendingTitle">等待执行</h2></div>
            <span id="pendingVisibleCount" class="section-count">0</span>
          </header>
          <div class="list-head" aria-hidden="true"><span>队列位置</span><span>事件</span><span>顺序 / 来源</span><span></span></div>
          <div id="pendingList" class="event-list"></div>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
