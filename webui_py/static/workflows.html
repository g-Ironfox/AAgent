<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AAgent Workflow 管理</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/workflows.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="AAgent 事件流">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name"><strong>AAgent</strong><small>WORKFLOWS</small></span>
    </a>
    <div class="top-actions">
      <nav class="page-nav" aria-label="页面导航">
        <a href="/">事件流</a>
        <a href="/subagents.html">子 Agent</a>
        <a class="active" href="/workflows.html" aria-current="page">Workflow</a>
        <a href="/terminal.html">终端</a>
        <a href="/document.html">文档</a>
        <a href="/setting.html">设置</a>
        <a href="/model.html">模型</a>
      </nav>
      <div class="workflow-management-state" aria-live="polite"><span>列表状态</span><strong id="workflowState">读取中</strong></div>
    </div>
  </header>

  <main class="workflow-management-main">
    <section class="workflow-management-workspace" aria-label="Workflow 管理">
      <aside class="workflow-management-sidebar" aria-label="Workflow 列表">
        <header class="workflow-management-heading">
          <div><p>WORKFLOWS</p><h1>Workflow</h1></div>
          <div class="workflow-library-actions">
            <button id="refreshButton" class="refresh-button" type="button">刷新</button>
            <input id="uploadFileInput" type="file" accept="application/json,.json" hidden>
            <button id="uploadButton" class="create-workflow-button" type="button" title="上传 Workflow" aria-label="上传 Workflow">+</button>
          </div>
        </header>
        <div id="workflowList" class="workflow-management-list" aria-live="polite"></div>
      </aside>

      <section class="workflow-configuration" aria-labelledby="configurationTitle">
        <header class="configuration-heading">
          <div class="configuration-title">
            <p>CONFIGURATION</p>
            <h2 id="configurationTitle">选择一个 Workflow</h2>
          </div>
          <div class="configuration-actions">
            <button id="renameButton" class="rename-workflow-button" type="button" hidden>重命名</button>
            <button id="deleteButton" class="delete-workflow-button" type="button" hidden>删除</button>
          </div>
        </header>
        <div class="configuration-content">
          <div id="workflowEmpty" class="configuration-empty">
            <strong>暂无配置项</strong>
          </div>
          <section id="metadataPanel" class="workflow-metadata" hidden>
            <div class="metadata-heading">
              <div><p>DATA CONTRACT</p><h3>数据端口</h3></div>
              <span class="metadata-readonly">只读</span>
            </div>
            <div class="metadata-columns">
              <section class="metadata-port-section" aria-labelledby="inputPortsTitle">
                <header><div><span class="metadata-port-mark input">IN</span><h4 id="inputPortsTitle">Input</h4></div></header>
                <div id="inputPorts" class="metadata-port-list"></div>
              </section>
              <section class="metadata-port-section" aria-labelledby="outputPortsTitle">
                <header><div><span class="metadata-port-mark output">OUT</span><h4 id="outputPortsTitle">Output</h4></div></header>
                <div id="outputPorts" class="metadata-port-list"></div>
              </section>
            </div>
            <section class="workflow-dependencies" aria-labelledby="workflowDependenciesTitle">
              <header>
                <div><p>DEPENDENCIES</p><h3 id="workflowDependenciesTitle">Workflow 依赖与契约</h3></div>
                <span id="dependencyCount" class="dependency-count"></span>
              </header>
              <div id="workflowDependencies" class="workflow-dependency-list"></div>
            </section>
          </section>
        </div>
      </section>
    </section>
  </main>

  <dialog id="uploadDialog" class="workflow-dialog">
    <form id="uploadForm">
      <header><div><p>UPLOAD WORKFLOW</p><h2>确认 Workflow 名称</h2></div><button class="dialog-close" type="button" data-close-dialog aria-label="关闭">×</button></header>
      <div class="dialog-fields">
        <label>名称<input id="uploadName" name="name" maxlength="120" required autocomplete="off"></label>
        <p id="uploadError" class="dialog-error" role="alert"></p>
      </div>
      <footer><button type="button" class="dialog-cancel" data-close-dialog>取消</button><button id="uploadSubmit" class="dialog-submit" type="submit">确认上传</button></footer>
    </form>
  </dialog>

  <dialog id="renameDialog" class="workflow-dialog">
    <form id="renameForm">
      <header><div><p>RENAME</p><h2>重命名 Workflow</h2></div><button class="dialog-close" type="button" data-close-dialog aria-label="关闭">×</button></header>
      <div class="dialog-fields">
        <label>名称<input id="renameName" name="name" maxlength="120" required autocomplete="off"></label>
        <p id="renameError" class="dialog-error" role="alert"></p>
      </div>
      <footer><button type="button" class="dialog-cancel" data-close-dialog>取消</button><button id="renameSubmit" class="dialog-submit" type="submit">保存</button></footer>
    </form>
  </dialog>

  <template id="metadataPortTemplate">
    <div class="metadata-port-row">
      <strong data-port-name></strong>
      <code data-port-type></code>
    </div>
  </template>

  <script type="module" src="/workflows.js?v=11"></script>
</body>
</html>
