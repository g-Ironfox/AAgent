<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AAgent Workflow</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/workflow.css">
</head>
<body class="workflow-page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="AAgent 事件流">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name"><strong>AAgent</strong><small>WORKFLOW</small></span>
    </a>
    <div class="top-actions">
      <nav class="page-nav" aria-label="页面导航">
        <a href="/">事件流</a>
        <a href="/subagents.html">子 Agent</a>
        <a class="active" href="/workflow.html" aria-current="page">Workflow</a>
        <a href="/terminal.html">终端</a>
        <a href="/document.html">文档</a>
        <a href="/setting.html">设置</a>
        <a href="/model.html">模型</a>
      </nav>
      <div class="workflow-state" aria-live="polite"><span>编辑状态</span><strong id="workflowState">本地草稿</strong></div>
      <button id="resetButton" class="toolbar-button secondary" type="button">重置</button>
      <input id="importFileInput" type="file" accept="application/json,.json" hidden>
      <button id="importButton" class="toolbar-button secondary" type="button">导入</button>
      <button id="exportButton" class="toolbar-button secondary" type="button">导出</button>
      <button id="saveButton" class="toolbar-button primary" type="button">保存草稿</button>
      <button id="uploadButton" class="toolbar-button primary" type="button">上传</button>
    </div>
  </header>

  <main class="workflow-main">
    <section class="workflow-shell" aria-labelledby="workflowTitle">
      <aside class="node-library" aria-label="节点库">
        <header class="panel-heading">
          <p>COMPONENTS</p>
          <h1 id="workflowTitle">节点</h1>
        </header>
        <div class="library-content">
          <article class="library-item fixed">
            <span class="node-symbol input-symbol" aria-hidden="true">IN</span>
            <div><strong>Input</strong><small>每个流程固定存在</small></div>
            <span class="fixed-tag">固定</span>
          </article>
          <button class="library-item" type="button" data-add-node="output">
            <span class="node-symbol output-symbol" aria-hidden="true">OUT</span>
            <div><strong>Output</strong><small>把 Content 发布到终端</small></div>
            <span class="add-symbol" aria-hidden="true">+</span>
          </button>
          <button class="library-item" type="button" data-add-node="router">
            <span class="node-symbol router-symbol" aria-hidden="true">R</span>
            <div><strong>Router</strong><small>由 LLM 从分支中选择一个</small></div>
            <span class="add-symbol" aria-hidden="true">+</span>
          </button>
          <button class="library-item" type="button" data-add-node="llm">
            <span class="node-symbol llm-symbol" aria-hidden="true">L</span>
            <div><strong>LLM</strong><small>执行模型并挂载工具</small></div>
            <span class="add-symbol" aria-hidden="true">+</span>
          </button>
          <button class="library-item" type="button" data-add-node="construct_message">
            <span class="node-symbol construct_message-symbol" aria-hidden="true">M</span>
            <div><strong>构造 Message</strong><small>为 content 指定消息角色</small></div>
            <span class="add-symbol" aria-hidden="true">+</span>
          </button>
          <button class="library-item" type="button" data-add-node="construct_content">
            <span class="node-symbol construct_content-symbol" aria-hidden="true">C</span>
            <div><strong>构造 Content</strong><small>按顺序组合输入或固定内容</small></div>
            <span class="add-symbol" aria-hidden="true">+</span>
          </button>
          <button class="library-item" type="button" data-add-node="construct_list">
            <span class="node-symbol construct_list-symbol" aria-hidden="true">L</span>
            <div><strong>构造列表</strong><small>把同类型输入聚合为列表</small></div>
            <span class="add-symbol" aria-hidden="true">+</span>
          </button>
          <button class="library-item" type="button" data-add-node="foreach">
            <span class="node-symbol foreach-symbol" aria-hidden="true">FE</span>
            <div><strong>遍历列表</strong><small>逐项执行循环体控制流</small></div>
            <span class="add-symbol" aria-hidden="true">+</span>
          </button>
          <button class="library-item" type="button" data-add-node="tool">
            <span class="node-symbol tool-symbol" aria-hidden="true">T</span>
            <div><strong>Tool</strong><small>直接调用一个已注册工具</small></div>
            <span class="add-symbol" aria-hidden="true">+</span>
          </button>
          <button class="library-item" type="button" data-add-node="tool_call">
            <span class="node-symbol tool_call-symbol" aria-hidden="true">TC</span>
            <div><strong>Tool Call</strong><small>执行 OpenAI 格式的工具调用</small></div>
            <span class="add-symbol" aria-hidden="true">+</span>
          </button>
        </div>
        <footer class="library-footer"><span>9 种节点</span><span id="nodeCount">4 个实例</span></footer>
      </aside>

      <section class="workflow-canvas-panel" aria-label="Workflow 画布">
        <header class="canvas-toolbar">
          <div><p>LOCAL DRAFT</p><strong>Agent 主控制流</strong></div>
          <div class="canvas-meta"><span id="connectionCount">5 条连接</span><span class="draft-badge">后端配置</span></div>
        </header>
        <div id="workflowCanvas" class="workflow-canvas">
          <div class="canvas-grid" aria-hidden="true"></div>
          <svg id="connectionLayer" class="connection-layer" aria-hidden="true"></svg>
          <div id="nodeLayer" class="node-layer"></div>
          <div class="canvas-legend" aria-hidden="true"><span><i class="control-dot"></i>CONTROL</span><span><i class="content-dot"></i>CONTENT</span><span><i class="message-dot"></i>MESSAGE</span><span><i class="list-content-dot"></i>LIST-CONTENT</span><span><i class="list-message-dot"></i>LIST-MESSAGE</span></div>
        </div>
      </section>

      <aside class="node-inspector" aria-label="节点配置">
        <header class="panel-heading inspector-heading">
          <div><p>INSPECTOR</p><h2 id="inspectorTitle">Input</h2></div>
          <span id="inspectorType" class="inspector-type">INPUT</span>
        </header>
        <div id="inspectorContent" class="inspector-content"></div>
      </aside>
    </section>
  </main>

  <template id="inputInspectorTemplate">
    <section class="inspector-section">
      <div class="section-label"><strong>接口契约</strong><span>只读</span></div>
      <div class="contract-group">
        <div class="contract-group-title">输入接口</div>
        <div class="empty-options">无输入接口</div>
      </div>
      <div class="contract-group">
        <div class="contract-group-title">输出接口</div>
        <div class="port-contract"><span class="port-swatch content"></span><strong>输入内容</strong><code>content</code></div>
      </div>
    </section>
  </template>

  <template id="routerInspectorTemplate">
    <section class="inspector-section">
      <div class="section-label"><strong>接口契约</strong><span>只读</span></div>
      <div class="contract-group">
        <div class="contract-group-title">输入接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>触发</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch content"></span><strong>输入</strong><code>content</code></div>
      </div>
      <div class="contract-group">
        <div class="contract-group-title">输出接口</div>
        <div data-router-output-contracts></div>
      </div>
    </section>
    <section class="inspector-section form-section">
      <label>节点名称<input data-field="name" maxlength="30"></label>
    </section>
    <section class="inspector-section">
      <div class="section-label"><strong>Switch 分支</strong><span>运行时单选</span></div>
      <div class="route-options" data-route-options></div>
      <button class="add-branch-button" type="button" data-add-branch>+ 添加分支</button>
      <small class="section-help">每个分支都有独立的控制流输出端点，运行时只会沿一条分支继续。</small>
    </section>
    <button class="delete-node-button" type="button" data-delete-node>删除节点</button>
  </template>

  <template id="llmInspectorTemplate">
    <section class="inspector-section">
      <div class="section-label"><strong>接口契约</strong><span>只读</span></div>
      <div class="contract-group">
        <div class="contract-group-title">输入接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>触发</strong><code>control</code></div>
        <div data-llm-input-contracts></div>
      </div>
      <div class="contract-group">
        <div class="contract-group-title">输出接口</div>
        <div data-llm-output-contracts></div>
      </div>
    </section>
    <section class="inspector-section">
      <div class="section-label"><strong>Message 输入</strong><span>按顺序发送</span></div>
      <div class="route-options" data-llm-input-options></div>
      <button class="add-branch-button" type="button" data-add-llm-input>+ 添加 Message</button>
      <small class="section-help">端口从 message-in-0 开始顺序生成，每个端口接收一条构造后的 Message。</small>
    </section>
    <section class="inspector-section form-section">
      <label>节点名称<input data-field="name" maxlength="30"></label>
      <label>模型<select data-field="model"><option>加载模型配置中</option></select></label>
      <label>系统指令<textarea data-field="prompt" rows="5" maxlength="500"></textarea></label>
      <label class="checkbox-field"><input type="checkbox" data-think><span><strong>Think</strong><small>启用推理过程输出</small></span></label>
      <label class="checkbox-field"><input type="checkbox" data-tool-calls><span><strong>Tool Calls</strong><small>启用 OpenAI 格式的工具调用输出</small></span></label>
    </section>
    <section class="inspector-section" data-llm-tools>
      <div class="section-label"><strong>挂载 Tools</strong><span data-tool-count>0 个</span></div>
      <div class="tool-options"><div class="empty-options">加载 Tool 注册表中</div></div>
    </section>
    <button class="delete-node-button" type="button" data-delete-node>删除节点</button>
  </template>

  <template id="construct_messageInspectorTemplate">
    <section class="inspector-section">
      <div class="section-label"><strong>接口契约</strong><span>只读</span></div>
      <div class="contract-group">
        <div class="contract-group-title">输入接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>触发</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch content"></span><strong>Content</strong><code>content</code></div>
      </div>
      <div class="contract-group">
        <div class="contract-group-title">输出接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>下一步</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch message"></span><strong>Message</strong><code>message</code></div>
      </div>
    </section>
    <section class="inspector-section form-section">
      <label>节点名称<input data-field="name" maxlength="30"></label>
      <label>Role<select data-field="role"><option value="user">user</option><option value="system">system</option><option value="assistant">assistant</option></select></label>
    </section>
    <button class="delete-node-button" type="button" data-delete-node>删除节点</button>
  </template>

  <template id="construct_listInspectorTemplate">
    <section class="inspector-section">
      <div class="section-label"><strong>接口契约</strong><span>只读</span></div>
      <div class="contract-group">
        <div class="contract-group-title">输入接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>触发</strong><code>control</code></div>
        <div class="list-input-contracts" data-list-input-contracts></div>
      </div>
      <div class="contract-group">
        <div class="contract-group-title">输出接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>下一步</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch" data-list-output-swatch></span><strong>列表</strong><code data-list-output-type></code></div>
      </div>
    </section>
    <section class="inspector-section form-section">
      <label>节点名称<input data-field="name" maxlength="30"></label>
      <label>列表数据类型<select data-field="item_type"><option value="content">content</option><option value="message">message</option></select></label>
      <label>初始值数量<input data-field="initial_value_count" type="number" min="0" max="20" step="1"></label>
    </section>
    <button class="delete-node-button" type="button" data-delete-node>删除节点</button>
  </template>

  <template id="foreachInspectorTemplate">
    <section class="inspector-section">
      <div class="section-label"><strong>接口契约</strong><span>受控循环</span></div>
      <div class="contract-group">
        <div class="contract-group-title">输入接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>触发</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>循环体结束</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch" data-foreach-list-swatch></span><strong>列表</strong><code data-foreach-list-type></code></div>
      </div>
      <div class="contract-group">
        <div class="contract-group-title">输出接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>下一步</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>循环体开始</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch" data-foreach-item-swatch></span><strong>当前项</strong><code data-foreach-item-type></code></div>
      </div>
    </section>
    <section class="inspector-section form-section">
      <label>节点名称<input data-field="name" maxlength="30"></label>
      <label>列表元素类型<select data-field="item_type"><option value="content">content</option><option value="message">message</option></select></label>
    </section>
    <button class="delete-node-button" type="button" data-delete-node>删除节点</button>
  </template>

  <template id="construct_contentInspectorTemplate">
    <section class="inspector-section">
      <div class="section-label"><strong>接口契约</strong><span>按内容项顺序执行</span></div>
      <div class="contract-group"><div class="contract-group-title">输入接口</div><div class="port-contract"><span class="port-swatch control"></span><strong>触发</strong><code>control</code></div><div data-append-input-contracts></div></div>
      <div class="contract-group"><div class="contract-group-title">输出接口</div><div class="port-contract"><span class="port-swatch control"></span><strong>下一步</strong><code>control</code></div><div class="port-contract"><span class="port-swatch content"></span><strong>构造后的 Content</strong><code>content</code></div></div>
    </section>
    <section class="inspector-section form-section"><label>节点名称<input data-field="name" maxlength="30"></label></section>
    <section class="inspector-section"><div class="section-label"><strong>内容项</strong><span>可添加多个</span></div><div data-append-items></div><button class="add-branch-button" type="button" data-add-append>+ 添加内容项</button></section>
    <button class="delete-node-button" type="button" data-delete-node>删除节点</button>
  </template>

  <template id="toolInspectorTemplate">
    <section class="inspector-section">
      <div class="section-label"><strong>接口契约</strong><span>只读</span></div>
      <div class="contract-group">
        <div class="contract-group-title">输入接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>触发</strong><code>control</code></div>
        <div data-tool-input-contracts><div class="empty-options">选择 Tool 后显示参数</div></div>
      </div>
      <div class="contract-group">
        <div class="contract-group-title">输出接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>下一步</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch content"></span><strong>执行结果</strong><code>content</code></div>
      </div>
    </section>
    <section class="inspector-section form-section">
      <label>节点名称<input data-field="name" maxlength="30"></label>
      <label>Tool<select data-field="tool"><option>加载 Tool 注册表中</option></select></label>
    </section>
    <button class="delete-node-button" type="button" data-delete-node>删除节点</button>
  </template>

  <template id="tool_callInspectorTemplate">
    <section class="inspector-section">
      <div class="section-label"><strong>接口契约</strong><span>OpenAI Tool Call</span></div>
      <div class="contract-group">
        <div class="contract-group-title">输入接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>触发</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch content"></span><strong>Tool Call</strong><code>content</code></div>
      </div>
      <div class="contract-group">
        <div class="contract-group-title">输出接口</div>
        <div class="port-contract"><span class="port-swatch control"></span><strong>下一步</strong><code>control</code></div>
        <div class="port-contract"><span class="port-swatch content"></span><strong>Tool Call ID</strong><code>content</code></div>
        <div class="port-contract"><span class="port-swatch content"></span><strong>结果</strong><code>content</code></div>
      </div>
    </section>
    <section class="inspector-section form-section"><label>节点名称<input data-field="name" maxlength="30"></label></section>
    <button class="delete-node-button" type="button" data-delete-node>删除节点</button>
  </template>

  <script type="module" src="/workflow.js"></script>
</body>
</html>
